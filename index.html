<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerenciador de Treinos FitGym Senna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-tab {
      border-bottom: 3px solid #3b82f6;
      color: #3b82f6;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Tela de Login -->
  <div id="loginOverlay" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl">
      <div class="flex justify-center mb-4">
        <!-- LOGO LOGIN: Altere o src abaixo com o caminho da sua imagem -->
        <img src="logo.png" alt="Logo FitGym Senna" class="w-20 h-20 object-contain filter drop-shadow-md" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2964/2964514.png';">
      </div>
      <h2 class="text-2xl font-bold text-center text-white mb-2">FitGym Access</h2>
      <p class="text-xs text-slate-400 text-center mb-6">Entre com seu usuário e senha fornecidos pelo instrutor.</p>
      
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Usuário / Login</label>
          <input type="text" id="loginUsername" required placeholder="Digite seu usuário" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
        </div>
        <p id="loginError" class="text-xs text-red-400 hidden text-center">Usuário ou senha incorretos.</p>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-semibold transition text-sm">Entrar no Sistema</button>
      </form>
    </div>
  </div>

  <!-- Header Principal -->
  <header id="appHeader" class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50 hidden">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <!-- LOGO HEADER: Altere o src abaixo com o caminho da sua imagem -->
        <img src="logo.png" alt="Logo FitGym Senna" class="w-10 h-10 object-contain p-1 bg-slate-700/80 rounded-lg border border-slate-600 shadow-sm" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2964/2964514.png';">
        <h1 class="text-xl font-bold text-white tracking-wide">FitGym <span class="text-blue-500">Senna</span></h1>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <div id="adminUserSelector" class="flex items-center gap-2">
          <label for="userSelect" class="text-sm font-medium text-slate-400 whitespace-nowrap">Aluno:</label>
          <select id="userSelect" onchange="switchUser(this.value)" class="bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
          </select>
          <button onclick="openUserModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 whitespace-nowrap">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Novo Aluno
          </button>
        </div>
        <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm px-3 py-2 rounded-lg font-medium transition">Sair</button>
      </div>
    </div>
  </header>

  <main id="appMain" class="max-w-6xl mx-auto px-4 mt-6 hidden">
    <div id="userProfileBanner" class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h2 id="currentUserName" class="text-xl font-bold text-white">Carregando dados...</h2>
        <p id="currentUserMeta" class="text-sm text-slate-400">Objetivo: -</p>
      </div>
      <button id="addExerciseBtn" onclick="openExerciseModal()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Adicionar Exercício
      </button>
    </div>

    <!-- Abas dos Dias da Semana -->
    <div class="flex border-b border-slate-700 mb-6 overflow-x-auto" id="categoryTabs"></div>

    <div id="exerciseGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="emptyState" class="hidden text-center py-16 bg-slate-800/50 rounded-2xl border border-dashed border-slate-700">
      <h3 class="text-lg font-semibold text-slate-300">Nenhum exercício encontrado</h3>
      <p class="text-slate-500 text-sm mt-1 mb-4">Adicione exercícios com links de GIF para montar esta rotina.</p>
      <button onclick="openExerciseModal()" class="admin-only bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg">Criar Exercício</button>
    </div>
  </main>

  <div id="gifViewerModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-[80]" onclick="closeGifViewer()">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-4 shadow-2xl relative flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="closeGifViewer()" class="absolute top-3 right-3 bg-slate-700/80 hover:bg-slate-600 text-white rounded-full p-2 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <h3 id="gifViewerTitle" class="text-lg font-bold text-white mb-3 text-center pr-8"></h3>
      <div class="w-full bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center min-h-[300px] max-h-[70vh]">
        <img id="gifViewerImage" src="" alt="GIF Exercício" class="w-full h-full object-contain max-h-[70vh]">
      </div>
      <p id="gifViewerNotes" class="text-slate-300 text-xs mt-3 bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 w-full text-center"></p>
    </div>
  </div>

  <div id="userModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4">Cadastrar Novo Aluno</h3>
      <form id="userForm" onsubmit="handleSaveUser(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Aluno</label>
          <input type="text" id="userNameInput" required placeholder="Ex: Carlos Silva" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Login de Acesso</label>
            <input type="text" id="userLoginInput" required placeholder="ex: carlos.silva" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Senha de Acesso</label>
            <input type="text" id="userPasswordInput" required placeholder="Senha123" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Objetivo de Treino (Escolha ou digite)</label>
          <input type="text" id="userGoalInput" list="goalsList" placeholder="Selecione um objetivo..." class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
          <datalist id="goalsList">
            <option value="Hipertrofia / Ganho de Massa">
            <option value="Emagrecimento / Perda de Gordura">
            <option value="Definição Muscular & Resistência">
            <option value="Fortalecimento Geral & Postura">
            <option value="Condicionamento Físico Cardiorrespiratório">
          </datalist>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeUserModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white">Cancelar</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold">Salvar Aluno</button>
        </div>
      </form>
    </div>
  </div>

  <div id="exerciseModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
      <h3 id="exerciseModalTitle" class="text-lg font-bold text-white mb-4">Adicionar Exercício ao Treino</h3>
      <form id="exerciseForm" onsubmit="handleSaveExercise(event)" class="space-y-4">
        <input type="hidden" id="exerciseIdInput">

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Exercícios Predefinidos (Opções Rápidas)</label>
          <select id="presetExerciseSelect" onchange="applyExercisePreset(this.value)" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm mb-3">
            <option value="">-- Selecionar um Exercício Pré-definido --</option>
            <option value="supino_reto">Segunda - Supino Reto com Barra</option>
            <option value="flexao_braco">Segunda - Flexão de Braços</option>
            <option value="remada_unilateral">Terça - Remada Unilateral com Halter</option>
            <option value="agachamento_smith">Quarta - Agachamento no Smith</option>
            <option value="leg_press">Quarta - Leg Press 45°</option>
          </select>
        </div>
        
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Exercício</label>
          <input type="text" id="exNameInput" required placeholder="Ex: Agachamento Livre" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Dia do Treino</label>
            <select id="exCategoryInput" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
              <option value="Segunda">Segunda-feira</option>
              <option value="Terça">Terça-feira</option>
              <option value="Quarta">Quarta-feira</option>
              <option value="Quinta">Quinta-feira</option>
              <option value="Sexta">Sexta-feira</option>
              <option value="Sábado / Cardio">Sábado / Cardio</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Séries x Repetições</label>
            <input type="text" id="exRepsInput" required placeholder="Ex: 4x 10-12" class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">URL / Link Direto do GIF</label>
          <input type="url" id="exGifInput" required placeholder="https://upload.wikimedia.org/..." class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Observações / Dicas de Execução</label>
          <textarea id="exNotesInput" rows="2" placeholder="Ex: Mantenha postura ereta e abdômen contraído." class="w-full bg-slate-700 text-white rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeExerciseModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white">Cancelar</button>
          <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-semibold">Salvar Exercício</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCK1oLYghs_v_siVWvPEfnnZhhH6jC3qEY",
      authDomain: "fitgym-d43bf.firebaseapp.com",
      databaseURL: "https://fitgym-d43bf-default-rtdb.firebaseio.com",
      projectId: "fitgym-d43bf",
      storageBucket: "fitgym-d43bf.firebasestorage.app",
      messagingSenderId: "975613301900",
      appId: "1:975613301900:web:ef59f4afecf504b62157a9",
      measurementId: "G-LV2R48TX5J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let appData = { users: [], exercises: [] };
    let currentUserId = "";
    let activeCategory = "Segunda";
    let currentUserRole = ""; 
    const categories = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado / Cardio"];

    const exercisePresets = {
      supino_reto: {
        name: "Supino Reto com Barra",
        category: "Segunda",
        reps: "4x 8-10",
        gifUrl: "https://upload.wikimedia.org/wikipedia/commons/7/7b/Bench-press-1.gif",
        notes: "Escápulas retraídas e pés firmes no chão."
      },
      flexao_braco: {
        name: "Flexão de Braços",
        category: "Segunda",
        reps: "4x 10-12",
        gifUrl: "https://upload.wikimedia.org/wikipedia/commons/b/b8/Pushups.gif",
        notes: "Mantenha o corpo alinhado e cotovelos em ~45 graus."
      },
      remada_unilateral: {
        name: "Remada Unilateral com Halter",
        category: "Terça",
        reps: "3x 12",
        gifUrl: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Dumbbell-row-1.gif",
        notes: "Puxe o halter em direção ao quadril mantendo o cotovelo próximo ao corpo."
      },
      agachamento_smith: {
        name: "Agachamento no Smith",
        category: "Quarta",
        reps: "4x 10-12",
        gifUrl: "https://upload.wikimedia.org/wikipedia/commons/8/82/Squats.gif",
        notes: "Mantenha a coluna neutra e pés alinhados com os ombros."
      },
      leg_press: {
        name: "Leg Press 45°",
        category: "Quarta",
        reps: "4x 12",
        gifUrl: "https://upload.wikimedia.org/wikipedia/commons/4/44/Leg-press-1.gif",
        notes: "Não feche os joelhos para dentro durante a execução."
      }
    };

    window.handleLogin = function(e) {
      e.preventDefault();
      const userVal = document.getElementById("loginUsername").value.trim();
      const passVal = document.getElementById("loginPassword").value.trim();
      const errorEl = document.getElementById("loginError");

      if (userVal === "Marcsenn57" && passVal === "solsena00") {
        currentUserRole = "admin";
        showApp();
        return;
      }

      const student = appData.users.find(u => u.username === userVal && u.password === passVal);
      if (student) {
        currentUserRole = "student";
        currentUserId = student.id;
        showApp();
      } else {
        errorEl.classList.remove("hidden");
      }
    };

    function showApp() {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("appHeader").classList.remove("hidden");
      document.getElementById("appMain").classList.remove("hidden");

      if (currentUserRole === "admin") {
        document.getElementById("adminUserSelector").classList.remove("hidden");
        document.getElementById("addExerciseBtn").classList.remove("hidden");
      } else {
        document.getElementById("adminUserSelector").classList.add("hidden");
        document.getElementById("addExerciseBtn").classList.add("hidden");
      }

      renderUserOptions();
      renderCategoryTabs();
      renderCurrentUserData();
      renderExercises();
    }

    window.logout = function() {
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("appHeader").classList.add("hidden");
      document.getElementById("appMain").classList.add("hidden");
      document.getElementById("loginForm").reset();
      document.getElementById("loginError").classList.add("hidden");
    };

    function listenToFirebase() {
      const appRef = ref(db, 'fitgym_data');
      onValue(appRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
          appData.users = val.users ? Object.keys(val.users).map(k => ({ id: k, ...val.users[k] })) : [];
          appData.exercises = val.exercises ? Object.keys(val.exercises).map(k => ({ id: k, ...val.exercises[k] })) : [];
        } else {
          setupDefaultData();
          return;
        }

        if (!currentUserId && appData.users.length > 0) {
          currentUserId = appData.users[0].id;
        }

        if (currentUserRole) {
          renderUserOptions();
          renderCurrentUserData();
          renderExercises();
        }
      });
    }

    function setupDefaultData() {
      const userRef = push(ref(db, 'fitgym_data/users'));
      const defaultUserId = userRef.key;
      
      set(userRef, { 
        name: "Marcelo Sena", 
        username: "marcelo", 
        password: "123", 
        goal: "Hipertrofia / Ganho de Massa" 
      });

      const ex1Ref = push(ref(db, 'fitgym_data/exercises'));
      set(ex1Ref, {
        userId: defaultUserId,
        category: "Segunda",
        name: "Flexão de Braços",
        reps: "4x 10-12",
        gifUrl: "https://upload.wikimedia.org/wikipedia/commons/b/b8/Pushups.gif",
        notes: "Mantenha o corpo alinhado e cotovelos em ~45 graus."
      });
    }

    function renderUserOptions() {
      const select = document.getElementById("userSelect");
      select.innerHTML = appData.users.map(u => 
        `<option value="${u.id}" ${u.id === currentUserId ? 'selected' : ''}>${u.name}</option>`
      ).join('');
    }

    window.switchUser = function(userId) {
      currentUserId = userId;
      renderCurrentUserData();
      renderExercises();
    };

    function renderCurrentUserData() {
      const user = appData.users.find(u => u.id === currentUserId);
      if (user) {
        document.getElementById("currentUserName").textContent = user.name;
        document.getElementById("currentUserMeta").textContent = `Objetivo: ${user.goal || 'Geral'}`;
      } else {
        document.getElementById("currentUserName").textContent = "Nenhum Usuário Selecionado";
        document.getElementById("currentUserMeta").textContent = "Objetivo: -";
      }
    }

    function renderCategoryTabs() {
      const tabsContainer = document.getElementById("categoryTabs");
      tabsContainer.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-6 py-3 font-medium text-sm whitespace-nowrap transition-all ${cat === activeCategory ? 'active-tab' : 'text-slate-400 hover:text-slate-200'}">
          ${cat}
        </button>
      `).join('');
    }

    window.selectCategory = function(cat) {
      activeCategory = cat;
      renderCategoryTabs();
      renderExercises();
    };

    function renderExercises() {
      const grid = document.getElementById("exerciseGrid");
      const emptyState = document.getElementById("emptyState");

      const filtered = appData.exercises.filter(
        ex => ex.userId === currentUserId && ex.category === activeCategory
      );

      if (filtered.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      grid.innerHTML = filtered.map(ex => `
        <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-lg flex flex-col justify-between hover:border-slate-600 transition">
          <div>
            <div onclick="openGifViewer('${ex.gifUrl}', '${ex.name.replace(/'/g, "\\'")}', '${(ex.notes || '').replace(/'/g, "\\'")}')" class="relative bg-slate-950 h-64 flex items-center justify-center overflow-hidden border-b border-slate-700 cursor-pointer group">
              <img 
                src="${ex.gifUrl}" 
                alt="${ex.name}" 
                class="w-full h-full object-contain p-2 group-hover:scale-105 transition-transform duration-300" 
                onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300/1e293b/94a3b8?text=GIF+N%C3%A3o+Encontrado';"
              />
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <span class="bg-blue-600/90 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1 shadow-md">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                  Ampliar GIF
                </span>
              </div>
              <span class="absolute top-3 left-3 bg-slate-900/90 text-blue-400 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-700">
                ${ex.reps}
              </span>
            </div>

            <div class="p-4">
              <h3 onclick="openGifViewer('${ex.gifUrl}', '${ex.name.replace(/'/g, "\\'")}', '${(ex.notes || '').replace(/'/g, "\\'")}')" class="font-bold text-lg text-white mb-2 cursor-pointer hover:text-blue-400 transition">${ex.name}</h3>
              ${ex.notes ? `<p class="text-slate-400 text-xs leading-relaxed bg-slate-900/50 p-3 rounded-lg border border-slate-700/40">${ex.notes}</p>` : ''}
            </div>
          </div>

          ${currentUserRole === 'admin' ? `
            <div class="flex justify-end gap-2 p-4 pt-0">
              <button onclick="editExercise('${ex.id}')" class="text-xs text-slate-400 hover:text-blue-400 px-2 py-1 transition">Editar</button>
              <button onclick="deleteExercise('${ex.id}')" class="text-xs text-slate-400 hover:text-red-400 px-2 py-1 transition">Excluir</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    window.openGifViewer = function(gifUrl, title, notes) {
      document.getElementById("gifViewerImage").src = gifUrl;
      document.getElementById("gifViewerTitle").textContent = title;
      const notesEl = document.getElementById("gifViewerNotes");
      if (notes) {
        notesEl.textContent = notes;
        notesEl.classList.remove("hidden");
      } else {
        notesEl.classList.add("hidden");
      }
      document.getElementById("gifViewerModal").classList.remove("hidden");
      document.getElementById("gifViewerModal").classList.add("flex");
    };

    window.closeGifViewer = function() {
      document.getElementById("gifViewerModal").classList.add("hidden");
      document.getElementById("gifViewerModal").classList.remove("flex");
      document.getElementById("gifViewerImage").src = "";
    };

    window.openUserModal = function() {
      document.getElementById("userForm").reset();
      document.getElementById("userModal").classList.remove("hidden");
      document.getElementById("userModal").classList.add("flex");
    };

    window.closeUserModal = function() {
      document.getElementById("userModal").classList.add("hidden");
      document.getElementById("userModal").classList.remove("flex");
    };

    window.handleSaveUser = function(e) {
      e.preventDefault();
      const name = document.getElementById("userNameInput").value.trim();
      const username = document.getElementById("userLoginInput").value.trim();
      const password = document.getElementById("userPasswordInput").value.trim();
      const goal = document.getElementById("userGoalInput").value.trim();

      const newUserRef = push(ref(db, 'fitgym_data/users'));
      set(newUserRef, { name, username, password, goal }).then(() => {
        currentUserId = newUserRef.key;
        window.closeUserModal();
      });
    };

    window.applyExercisePreset = function(key) {
      if (!key || !exercisePresets[key]) return;
      const preset = exercisePresets[key];
      document.getElementById("exNameInput").value = preset.name;
      document.getElementById("exCategoryInput").value = preset.category;
      document.getElementById("exRepsInput").value = preset.reps;
      document.getElementById("exGifInput").value = preset.gifUrl;
      document.getElementById("exNotesInput").value = preset.notes;
    };

    window.openExerciseModal = function(isEdit = false) {
      if (!currentUserId) {
        alert("Cadastre ou selecione um usuário primeiro!");
        return;
      }
      if (!isEdit) {
        document.getElementById("exerciseForm").reset();
        document.getElementById("presetExerciseSelect").value = "";
        document.getElementById("exerciseIdInput").value = "";
        document.getElementById("exCategoryInput").value = activeCategory;
        document.getElementById("exerciseModalTitle").textContent = "Adicionar Exercício";
      }
      document.getElementById("exerciseModal").classList.remove("hidden");
      document.getElementById("exerciseModal").classList.add("flex");
    };

    window.closeExerciseModal = function() {
      document.getElementById("exerciseModal").classList.add("hidden");
      document.getElementById("exerciseModal").classList.remove("flex");
    };

    window.handleSaveExercise = function(e) {
      e.preventDefault();
      const id = document.getElementById("exerciseIdInput").value;
      const name = document.getElementById("exNameInput").value.trim();
      const category = document.getElementById("exCategoryInput").value;
      const reps = document.getElementById("exRepsInput").value.trim();
      const gifUrl = document.getElementById("exGifInput").value.trim();
      const notes = document.getElementById("exNotesInput").value.trim();

      const exerciseData = { userId: currentUserId, category, name, reps, gifUrl, notes };

      if (id) {
        update(ref(db, `fitgym_data/exercises/${id}`), exerciseData).then(() => {
          window.closeExerciseModal();
        });
      } else {
        const newExRef = push(ref(db, 'fitgym_data/exercises'));
        set(newExRef, exerciseData).then(() => {
          activeCategory = category;
          window.closeExerciseModal();
        });
      }
    };

    window.editExercise = function(id) {
      const ex = appData.exercises.find(item => item.id === id);
      if (!ex) return;
      document.getElementById("exerciseIdInput").value = ex.id;
      document.getElementById("exNameInput").value = ex.name;
      document.getElementById("exCategoryInput").value = ex.category;
      document.getElementById("exRepsInput").value = ex.reps;
      document.getElementById("exGifInput").value = ex.gifUrl;
      document.getElementById("exNotesInput").value = ex.notes || "";
      document.getElementById("exerciseModalTitle").textContent = "Editar Exercício";
      window.openExerciseModal(true);
    };

    window.deleteExercise = function(id) {
      if (confirm("Tem certeza que deseja remover este exercício do treino?")) {
        remove(ref(db, `fitgym_data/exercises/${id}`));
      }
    };

    listenToFirebase();
  </script>
</body>
</html>
